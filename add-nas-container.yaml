version: "1.0.0"
title: "Add NAS Container"
description: "Add a new container to the NAS the same way nas-port-mcp and parquet-peek were added: create /volumeUSB1/usbshare/docker/<name>/compose.yaml with a sensible memory cap and the correct watchtower labels (watchtower-nick scope=nick for your own GHCR images, plain watchtower for third-party), add the service to the gethomepage dashboard, deploy, verify memory/health, and finally scan the container logs for errors and triage them (real fault vs monitor-probe artifact vs benign first-boot noise). For MCP tool servers, also join the ai_proxy network and auto-register them behind the Traefik reverse proxy so they get an externally-reachable URL (e.g. http://100.82.223.13:8092/<name>/mcp)."
parameters:
  - key: container_name
    input_type: string
    requirement: required
    description: "Kebab-case name for the container/service (e.g. nas-port-mcp, catalog-mcp)"
  - key: image
    input_type: string
    requirement: required
    description: "Full image reference (e.g. ghcr.io/nickbrett1/nas-port-mcp:latest)"
  - key: is_mcp
    input_type: boolean
    requirement: optional
    default: "false"
    description: "true if this is an MCP/OpenAPI tool server that Open WebUI and other tools should reach through the Traefik reverse proxy. Joins the ai_proxy network and adds the traefik.* labels."
  - key: mcp_port
    input_type: string
    requirement: optional
    default: "8000"
    description: "The in-container port the MCP/OpenAPI server listens on (used by the Traefik label). Only relevant when is_mcp=true."
  - key: mcp_path
    input_type: string
    requirement: optional
    default: "/mcp"
    description: "The path the MCP server serves on mcp_port (e.g. /mcp, /api/mcp, /openapi.json). Used for the external URL and homepage link. Only relevant when is_mcp=true."
  - key: proxy_url
    input_type: string
    requirement: optional
    default: "http://100.82.223.13:8092"
    description: "Base URL of the Traefik reverse proxy (entry point). The MCP service is reachable at <proxy_url>/<container_name>/<mcp_path>. Only relevant when is_mcp=true."
  - key: is_own_container
    input_type: boolean
    requirement: optional
    default: "false"
    description: "true if this is your own image (ghcr.io/nickbrett1/*) — routes it to watchtower-nick (scope=nick, 60s poll)"
  - key: description
    input_type: string
    requirement: optional
    default: ""
    description: "One-line description of what the container does (used in the homepage entry)"
  - key: ports
    input_type: string
    requirement: optional
    default: ""
    description: "Port mapping(s), e.g. '8080:80' or '127.0.0.1:3002:3000' (loopback for local-only tools). Leave empty for network_mode: host or no published ports. For MCP servers behind the proxy this is OPTIONAL — Traefik routes internally, so a host publish is only needed for direct access."
  - key: network_mode
    input_type: select
    requirement: optional
    description: "Docker network mode. host is only for tools that must see the host network namespace (like nas-port-mcp). Ignored when is_mcp=true (MCP servers join ai_proxy instead)."
    default: "bridge"
    options:
      - bridge
      - host
  - key: mem_limit
    input_type: string
    requirement: optional
    default: "512m"
    description: "Memory limit (mem_limit + memswap_limit, set equal). 512m baseline for small utilities/MCP servers; 1g-2g for apps with databases/heavy runtimes; parquet-peek needed 2048m"
  - key: volumes
    input_type: string
    requirement: optional
    default: ""
    description: "Volume mounts, one per line, e.g. '/volume1/marketdata/backup/parquet:/data:ro'"
  - key: environment
    input_type: string
    requirement: optional
    default: ""
    description: "Extra environment variables (TZ=US/Eastern is added automatically), one per line 'KEY=value'"
  - key: homepage_group
    input_type: select
    requirement: required
    description: "Which group in /volumeUSB1/usbshare/docker/homepage/config/services.yaml to add the service under"
    options:
      - "Servers & Devices"
      - "Media Stack"
      - "Data & Markets"
      - "AI & LLMs"
      - "Network & Security"
      - "System & Monitoring"
      - "Utilities & Search"
      - "Tasks & Productivity"
  - key: icon
    input_type: string
    requirement: optional
    default: "mdi-docker"
    description: "Homepage icon: an mdi-* name (e.g. mdi-table-large), an http(s) icon URL (e.g. selfhst/icons png), or a png filename already in the homepage icons dir"
  - key: health_endpoint
    input_type: string
    requirement: optional
    default: ""
    description: "HTTP health path for the homepage siteMonitor. For non-MCP services it is appended to http://127.0.0.1:<port>. For MCP services it is appended to the proxy URL."
  - key: widget
    input_type: string
    requirement: optional
    default: ""
    description: "Optional homepage widget config (the lines under 'widget:', minus indentation), e.g. 'type: <type>' plus 'url: http://127.0.0.1:<port>' and 'key: <key>' where the widget needs one"
prompt: |
  Add a new container to the NAS: **{{ container_name }}** (image `{{ image }}`).
  {% if is_mcp == "true" %}This is an MCP/OpenAPI tool server — expose it behind the Traefik reverse proxy ({{ proxy_url }}/{{ container_name }}/{{ mcp_path }}).{% endif %}
  {% if is_own_container == "true" %}This is my own image — route it to watchtower-nick (scope=nick).{% else %}Third-party image — plain watchtower (nightly 03:00).{% endif %}
  {% if description %}What it does: {{ description }}{% endif %}
  {% if ports %}Ports: {{ ports }}{% endif %}
  {% if mem_limit %}Memory limit: {{ mem_limit }}{% endif %}
  {% if volumes %}Volumes:
  {{ volumes }}{% endif %}
  {% if environment %}Environment:
  {{ environment }}{% endif %}
  Homepage group: {{ homepage_group }}.
  {% if health_endpoint %}Health endpoint: {{ health_endpoint }}{% endif %}
  {% if widget %}Widget: {{ widget }}{% endif %}
instructions: |
  You are adding a new container to the NAS. Follow the established conventions of the existing stacks (/volumeUSB1/usbshare/docker/mealie, vikunja, nas-port-mcp, parquet-peek, ...) — read one or two of those compose files first so the new file matches the house style exactly.

  ## Step 0 — Confirm details
  Before writing anything, confirm with the user (or use the provided parameters):
  - Container name, image, and what it does.
  - **Is it an MCP/OpenAPI tool server?** (is_mcp) If so, it must join the `ai_proxy` network and get the `traefik.*` labels so Open WebUI and other tools can reach it through the reverse proxy. Record mcp_port and mcp_path.
  - Ports: published mapping `host:container`, loopback `127.0.0.1:host:container` for local-only tools, or `network_mode: host` when the tool must see the host network namespace (like nas-port-mcp). MCP servers behind the proxy generally do NOT need a host port.
  - Volumes and environment variables.
  - Image provenance: own image (ghcr.io/nickbrett1/*), third-party registry image, or a locally built image with no registry push (like vikunja-mcp).

  ## Step 1 — Create the compose file
  Create `/volumeUSB1/usbshare/docker/{{ container_name }}/compose.yaml`. Two skeletons, depending on `is_mcp`:

  **Non-MCP** (match the existing files' formatting):

  ```yaml
  services:
    {{ container_name }}:
      image: {{ image }}
      container_name: {{ container_name }}
      restart: always
      mem_limit: {{ mem_limit }}
      memswap_limit: {{ mem_limit }}
      {% if network_mode == "host" %}network_mode: host
      {% elif ports %}ports:
        - "{{ ports }}"
      {% endif %}environment:
        - TZ=US/Eastern
      volumes:
      labels:
        {% if is_own_container == "true" %}- "com.centurylinklabs.watchtower.enable=true"
        - "com.centurylinklabs.watchtower.scope=nick"{% else %}- "com.centurylinklabs.watchtower.enable=true"{% endif %}
  ```

  **MCP tool server** (is_mcp=true) — same base, but join `ai_proxy` and add the Traefik labels:

  ```yaml
  services:
    {{ container_name }}:
      image: {{ image }}
      container_name: {{ container_name }}
      restart: always
      mem_limit: {{ mem_limit }}
      memswap_limit: {{ mem_limit }}
      {% if ports %}ports:
        - "{{ ports }}"
      {% endif %}environment:
        - TZ=US/Eastern
      volumes:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.{{ container_name }}.rule=PathPrefix(`/{{ container_name }}`)"
        - "traefik.http.routers.{{ container_name }}.service={{ container_name }}"
        - "traefik.http.routers.{{ container_name }}.middlewares={{ container_name }}-strip"
        - "traefik.http.services.{{ container_name }}.loadbalancer.server.port={{ mcp_port }}"
        - "traefik.http.middlewares.{{ container_name }}-strip.stripprefix.prefixes=/{{ container_name }}"
        {% if is_own_container == "true" %}- "com.centurylinklabs.watchtower.enable=true"
        - "com.centurylinklabs.watchtower.scope=nick"{% else %}- "com.centurylinklabs.watchtower.enable=true"{% endif %}
      networks:
        - ai_proxy

  networks:
    ai_proxy:
      external: true
  ```

  Notes:
  - `restart: always` is intentional — the container comes back up automatically whenever the NAS reboots (Synology restarts Docker on boot; `always` restarts unconditionally). Keep it as-is.
  - The Traefik labels make the service reachable at **`{{ proxy_url }}/{{ container_name }}/{{ mcp_path }}`** (Traefik strips the `/<name>` prefix, so the backend still sees its canonical `{{ mcp_path }}`). Traefik auto-discovers it via the Docker provider — no Traefik restart needed.
  - For MCP servers, `network_mode` defaults to bridge and the container is joined to the external `ai_proxy` network so both Traefik and Open WebUI can reach it by container name. A host `ports:` publish is optional (direct access only).
  - Fill in the `volumes:` and `environment:` lists from the parameters (each entry as a `- "KEY=value"` or `- "src:dst"` line at the same indentation as `- TZ=US/Eastern`).

  Memory limits are **mandatory** — always set `mem_limit` and `memswap_limit` to the same value:
  - 512m baseline for small utilities/MCP servers.
  - 1g–2g for apps with databases or heavy runtimes.
  - parquet-peek lesson: a 512m cgroup was OOM-killed because DuckDB in-process never sees the cgroup limit and never spills; it needed 2048m. If the app does heavy in-process compute, prefer 2g and verify with docker stats.
  - Locally built image with no registry (so watchtower cannot update it): use `com.centurylinklabs.watchtower.enable=false` instead and note the manual rebuild command in a comment (see vikunja-mcp).

  Validate the file before deploying:
  `sudo docker compose -f /volumeUSB1/usbshare/docker/{{ container_name }}/compose.yaml config --quiet`

  ## Step 2 — Deploy
  `cd /volumeUSB1/usbshare/docker/{{ container_name }} && sudo docker compose up -d`
  Confirm it is running: `sudo docker ps --filter name={{ container_name }}`
  If a health endpoint was given, check it. For MCP services verify the proxy route responds (Traefik hot-reloads the labels within seconds):
  `curl -s -o /dev/null -w '%{http_code}' {{ proxy_url }}/{{ container_name }}{{ mcp_path }}`

  ## Step 3 — Verify memory (the parquet-peek lesson)
  Run `sudo docker stats --no-stream {{ container_name }}` and compare MemUsage to the limit. If the container is near/over the limit, has a rising RestartCount, or repeatedly exits with code 137 (OOM), raise `mem_limit` in the compose file and `sudo docker compose up -d` again. Check for crash-looping with `sudo docker inspect {{ container_name }}` (look at the RestartCount field).

  ## Step 4 — Confirm watchtower routing (the labels did the work)
  Confirm the labels landed: `sudo docker inspect {{ container_name }}` and grep the Labels for `centurylinklabs`.
  - Own image → scope=nick label → **watchtower-nick** (60s poll) picks it up on its next cycle, no restart needed; a new GHCR publish is pulled within ~15 min.
  - Third-party → no scope label → **watchtower** (nightly 03:00) covers it.
  - Locally built → enable=false → neither updates it; note the manual rebuild command.

  ## Step 5 — Add to homepage (gethomepage)
  Edit `/volumeUSB1/usbshare/docker/homepage/config/services.yaml` and add the service under the **{{ homepage_group }}** group, matching the existing YAML style. For MCP services use the proxy URL as the href:

  ```yaml
      - {{ container_name }}:
          icon: {{ icon }}
          {% if is_mcp == "true" %}href: {{ proxy_url }}/{{ container_name }}/{{ mcp_path }}
          {% else %}href: http://nas:<port>/
          {% endif %}{% if description %}description: {{ description }}
          {% endif %}server: local
          container: {{ container_name }}
          {% if health_endpoint %}siteMonitor: http://127.0.0.1:<port>{{ health_endpoint }}
          {% endif %}
  ```

  Use `icon` from the parameters (an mdi-* name, an icon URL, or a png in /volumeUSB1/usbshare/docker/homepage/config/icons/).

  **Verify the monitor URL — do not assume it.** Homepage probes `siteMonitor` with **HEAD first**, and only retries with GET when the status is `> 403`. So an endpoint that answers `405` to HEAD (Tornado and route-only handlers routinely do) is stored verbatim as the tile's status: the tile reads *down* while the app is perfectly healthy, and the app logs a warning on every single poll. Probe both methods before committing the URL:

  ```
  curl -s -o /dev/null -w 'HEAD=%{http_code}\n' -I http://127.0.0.1:<port>{{ health_endpoint }}
  curl -s -o /dev/null -w 'GET=%{http_code}\n'    http://127.0.0.1:<port>{{ health_endpoint }}
  ```

  Both must be 2xx/3xx. If HEAD comes back `405`, either point `siteMonitor` at an unauthenticated static asset that does answer HEAD (e.g. `/static/favicon.ico`), or omit `siteMonitor` entirely and let the `container:` ref be the monitor. Never ship a `siteMonitor` you have not probed with HEAD.
  {% if widget %}If a `widget` was provided, add it after `container:` with each line indented two spaces deeper than the service keys (see the plex/miniflux entries for the shape). The widget lines are:

  {{ widget }}

  Indent each line to sit under the `widget:` key (two spaces deeper than the service keys).{% endif %}
  Homepage auto-reloads config on change; if the tile has not appeared within ~30 seconds, restart it: `sudo docker restart homepage`.

  ## Step 6 — Read the logs (the tile can lie; the log cannot)
  Give the container ~60 s to finish first boot, then actually read what it wrote. A container that says `Up` and answers its health endpoint can still be logging an error on every single poll.

  ```
  sudo docker logs --since 15m {{ container_name }} 2>&1 | tail -n 150
  sudo docker logs --since 15m {{ container_name }} 2>&1 | grep -Ein 'error|warn|exception|traceback|fatal|panic|denied|refused|timeout|not found|no such file|cannot|fail' | head -40
  sudo docker logs --since 15m {{ container_name }} 2>&1 | grep -E '(HEAD|GET|POST|PUT|PATCH|DELETE) /' | grep -Ev ' (200|201|204|206|301|302|304)\b' | head -40
  ```

  The first is the raw tail; the second catches levelled errors and warnings; the third isolates **non-2xx request lines** (a bare `4[0-9][0-9]` pattern would match ports, byte counts and timings too, so match on the method instead). `docker logs` writes the app's stderr to *stderr*, so the `2>&1` is required or grep sees nothing. Triage every hit into one of three buckets, and record the bucket in the final report so a later session does not re-open a line that was already judged:

  - **Real fault — fix it before reporting success.** `address already in use` (port clash), volume or permission errors (`EACCES`, `Permission denied` — usually a uid mismatch: compare `docker exec {{ container_name }} id` against `ls -ln` on the host path), a missing required env var, upstream auth failures, failed DB migrations, OOM (`exited 137`, see Step 3). None of these may be left open in the summary.
  - **Probe artifact — fix the caller, not the container.** Requests that come from a monitor or your own `curl` rather than from real use. The tell is a request line naming a method the app does not implement, e.g. `405 HEAD /api`. Resolve the caller from the logged IP: a bridge gateway (`172.18.0.1`, `172.17.0.1`) is **host-originated** — a host-networked monitor such as homepage, or your own shell — while `172.x.0.y` is another container. A 405/404 from a monitor is not a container fault, but it does mean the **dashboard is recording that status as the service state** (homepage stores the HEAD result verbatim), so the tile can read *down* while the app is fine. Fix it by correcting the `siteMonitor` URL per Step 5, or by dropping `siteMonitor` and relying on the `container:` ref.
  - **Benign first-boot noise.** Optional config absent, deprecation warnings, a "no such file" for a deliberately empty volume, telemetry/TLS chatter. Fine to keep — but say so explicitly in the report instead of staying silent.

  Then confirm the container goes **quiet at steady state**: after it has settled (2–3 min), re-run the tail and check nothing new is accumulating. A line that repeats on a timer — every poll, every 60 s — is a real defect even when its level is only `W`.

  ## Step 7 — Register the MCP URL (if is_mcp) and summarize
  If this is an MCP/OpenAPI tool server, the externally-reachable URL is:
  **`{{ proxy_url }}/{{ container_name }}/{{ mcp_path }}`**
  - In **Open WebUI** → Workspace → Tools → Add tool server, set the URL to that value (for OpenAPI connections, the URL is the `{{ proxy_url }}/{{ container_name }}` base and the `{{ mcp_path }}` goes in the path field).
  - The same URL can be pasted into any MCP client (Claude, goose, curl, etc.) from anywhere on the Tailnet or LAN.
  - If an auth token/key is required, add it as the bearer token in the client config.

  Report: compose file path, deploy status, memory limit + observed usage, watchtower routing (which instance + poll interval), the MCP URL (if applicable), the homepage entry, and the **log-scan result** from Step 6 — what was found, which bucket each line fell into, and whether the container is quiet at steady state. Flag anything left for the user (widget API keys, auth tokens, first-run setup, etc.). Update the session todo list with any follow-ups.
